name: Remove Profile Views Counter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-profile-views:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove profile views counter
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)
          filtered = [line for line in lines if "komarev.com/ghpvc/" not in line and 'alt="Profile views"' not in line]
          p.write_text("".join(filtered), encoding="utf-8")
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Profile views counter already removed."
          else
            git commit -m "Remove profile views counter from README"
            git push
          fi
